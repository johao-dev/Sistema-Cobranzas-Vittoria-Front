<div class="panel asignacion-rol">
  <div class="panel-title">Asignar rol</div>
  @if (cargando()) {
    <p role="status">Cargando roles...</p>
  }
  @if (error()) {
    <p role="alert">{{ error() }}</p>
    <button type="button" class="btn btn-ghost" (click)="cargarRoles()">Reintentar roles</button>
  }
  <div class="form-grid two">
    <div class="field">
      <label for="rol-usuario">Rol</label>
      <select
        id="rol-usuario"
        [(ngModel)]="roleId"
        [disabled]="bloqueado() || guardando() || cargando() || !!error()"
      >
        <option [ngValue]="null">Seleccionar</option>
        @for (rol of roles(); track rol.idRol) {
          <option [ngValue]="rol.idRol">{{ rol.nombre }}</option>
        }
      </select>
    </div>
  </div>
  <div class="toolbar">
    <button
      type="button"
      class="btn btn-success"
      (click)="asignarRol()"
      [disabled]="
        !idUsuario() || !roleId() || bloqueado() || guardando() || cargando() || !!error()
      "
    >
      {{ guardando() ? 'Asignando…' : 'Asignar rol' }}
    </button>
  </div>
  @if (asignados().length) {
    <div class="roles-asignados">
      @for (rol of asignados(); track $index) {
        <span class="list-chip">{{ rol.nombreRol }}</span>
      }
    </div>
  }
</div>
