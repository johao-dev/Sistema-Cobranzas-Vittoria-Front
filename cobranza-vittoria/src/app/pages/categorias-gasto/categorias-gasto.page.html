<div class="page-header">
  <div>
    <div class="page-title">Categorías de gasto</div>
    <div class="page-subtitle">Mantenimiento del catálogo usado por los gastos administrativos.</div>
  </div>
</div>

<div class="split split--form admin-split">
  <section class="panel">
    <div class="panel-title-row"><div class="panel-title">Listado</div>
    <div class="filters compact-filters maintenance-search">
      <div class="field">
        <label>Buscar</label>
        <input type="text" [(ngModel)]="filtroBusqueda" placeholder="Buscar categorías de gasto" />
      </div>
    </div>
<button type="button" class="btn btn-primary btn-sm" (click)="abrirModalNuevo()">+ Nuevo registro</button>
<button type="button" class="btn btn-secondary btn-sm" (click)="abrirImportModal()">Importar</button></div>

    <div class="filters filters--two compact-filters">
      <div class="field">
        <label>Estado</label>
        <select [(ngModel)]="filtroActivo" (change)="load()">
          <option value="">Todos</option>
          <option value="true">Activo</option>
          <option value="false">Inactivo</option>
        </select>
      </div>
    </div>

    <div *ngIf="loading" class="empty-state">Cargando categorías...</div>
    <div *ngIf="!loading && !rowsFiltradas.length" class="empty-state">No hay categorías registradas.</div>

    <div *ngIf="!loading && rowsFiltradas.length" class="table-wrap table-wrap--sticky-actions table-wrap--categorias">
      <table>
        <thead>
          <tr>
            <th>Categoría</th>
            <th>Estado</th>
            <th class="actions-col actions-col--select">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of rowsFiltradas">
            <td>{{ row.nombre }}</td>
            <td>
              <span class="badge" [class.badge--ok]="row.activo" [class.badge--neutral]="!row.activo">
                {{ row.activo ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td class="actions-col--select">
              <select class="actions-select" (change)="onAccion($event, row)">
                <option value="">Acciones</option>
                <option value="edit">Editar</option>
                <option value="estado" [disabled]="!row.activo">Desactivar</option>
              </select>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <div class="design-modal-backdrop" *ngIf="modalOpen" (click)="cerrarModal()"></div>
  <section class="panel panel--form design-modal-card" *ngIf="modalOpen" (click)="$event.stopPropagation()">
    <button type="button" class="modal-close" (click)="cerrarModal()" aria-label="Cerrar">×</button>
    <div class="panel-title">Formulario</div>

    <div class="form-grid one">
      <div class="field">
        <label>Nombre</label>
        <input [(ngModel)]="form.nombre" placeholder="Ej. Servicios básicos" />
      </div>

      <div class="field">
        <label>Estado</label>
        <select [(ngModel)]="form.activo">
          <option [ngValue]="true">Activo</option>
          <option [ngValue]="false">Inactivo</option>
        </select>
      </div>
    </div>

    <div class="toolbar toolbar--compact">
      <button class="btn btn-primary" (click)="save()">Guardar categoría</button>
      <button class="btn btn-ghost" (click)="reset()">Limpiar</button>
    </div>
  </section>
  <app-import-modal
    *ngIf="importOpen"
    modulo="categoria-gasto"
    (onClose)="cerrarImportModal()"
    (onSuccess)="onImportSuccess()">
  </app-import-modal>
</div>
