<article class="permiso-card">
  <div class="permiso-card__info">
    <div class="permiso-card__title">{{ permiso().nombre }}</div>
    <div class="permiso-card__desc">{{ permiso().descripcion || 'Sin descripción' }}</div>
  </div>

  <div class="permiso-card__controls">
    <label class="switch" [title]="permiso().activo ? 'Deshabilitar' : 'Habilitar'">
      <input
        type="checkbox"
        [checked]="permiso().activo"
        [disabled]="bloqueado()"
        [attr.aria-label]="(permiso().activo ? 'Deshabilitar ' : 'Habilitar ') + permiso().nombre"
        (change)="onToggle($event)"
      />
      <span class="slider"></span>
    </label>

    <div class="permiso-card__actions">
      <button
        type="button"
        class="permiso-card__menu-btn"
        (click)="toggleMenu()"
        [disabled]="bloqueado()"
        [attr.aria-expanded]="menuOpen()"
        aria-label="Acciones"
      >
        ⋮
      </button>

      @if (menuOpen()) {
        <div class="permiso-card__menu">
          <button
            type="button"
            class="permiso-card__menu-item"
            (click)="onEdit()"
            [disabled]="bloqueado()"
          >
            Editar
          </button>
        </div>
      }
    </div>
  </div>
</article>
